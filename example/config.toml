[faktory]
# How long jobs are kept in the dead set (Morgue) before being purged.
# Value is a Go duration string; the default is 180 days ("4320h").
dead_timeout = "4320h"
# Maximum number of jobs retained in the dead set. When the set grows beyond
# this, the oldest dead jobs are trimmed. Set to 0 to disable the limit.
dead_max_size = 10000

[queues]
# disable backpressure by default
backpressure = 0

[queues.default]
# the default queue will allow up to 100,000 jobs.  After that,
# further PUSHes will get an error until the queue is drained
# below that threshold.
backpressure = 100000

[security]

[security.tls]
public_key = "/etc/faktory/tls/public.crt"
private_key = "/etc/faktory/tls/private.crt"
